# HSR ring integration topology (4 RedBoxes, hsr-san) — mirrors the user's
# GNS3 setup (prp1..prp4):
#
#   san-1 -- redbox-a (prp1) -- ring12 -- redbox-b (prp2) -- san-2
#              |                                  |
#            ring41                            ring23
#              |                                  |
#   san-4 -- redbox-d (prp4) -- ring34 -- redbox-c (prp3) -- san-3
#
# Four RedBoxes each bridge their own SAN segment onto the HSR ring via
# HSR-tagged frames on their two ring ports. A 4-node ring forces
# multi-hop traversal: with a link broken, a frame may need 2+ hops, so
# every node must forward frames regardless of the path bits.
#
# Interface naming inside each RedBox:
#   eth0 = ring port A, eth1 = ring port B, eth2 = SAN (interlink)

x-redbox: &redbox
  image: prp-sim:test
  privileged: true

services:
  redbox-a:
    <<: *redbox
    volumes:
      - ../../configs/hsr-redbox-a.yaml:/etc/prp/config.yaml
    networks:
      ring41:
        interface_name: eth0
      ring12:
        interface_name: eth1
      san-net-1:
        interface_name: eth2

  redbox-b:
    <<: *redbox
    volumes:
      - ../../configs/hsr-redbox-b.yaml:/etc/prp/config.yaml
    networks:
      ring12:
        interface_name: eth0
      ring23:
        interface_name: eth1
      san-net-2:
        interface_name: eth2

  redbox-c:
    <<: *redbox
    volumes:
      - ../../configs/hsr-redbox-c.yaml:/etc/prp/config.yaml
    networks:
      ring23:
        interface_name: eth0
      ring34:
        interface_name: eth1
      san-net-3:
        interface_name: eth2

  redbox-d:
    <<: *redbox
    volumes:
      - ../../configs/hsr-redbox-d.yaml:/etc/prp/config.yaml
    networks:
      ring34:
        interface_name: eth0
      ring41:
        interface_name: eth1
      san-net-4:
        interface_name: eth2

  san-1:
    image: alpine:3.19
    command: ["sh", "-c", "ip addr add 10.0.0.11/24 dev eth0 2>/dev/null; sleep 3600"]
    privileged: true
    networks:
      san-net-1:
        interface_name: eth0

  san-2:
    image: alpine:3.19
    command: ["sh", "-c", "ip addr add 10.0.0.12/24 dev eth0 2>/dev/null; sleep 3600"]
    privileged: true
    networks:
      san-net-2:
        interface_name: eth0

  san-3:
    image: alpine:3.19
    command: ["sh", "-c", "ip addr add 10.0.0.13/24 dev eth0 2>/dev/null; sleep 3600"]
    privileged: true
    networks:
      san-net-3:
        interface_name: eth0

  san-4:
    image: alpine:3.19
    command: ["sh", "-c", "ip addr add 10.0.0.14/24 dev eth0 2>/dev/null; sleep 3600"]
    privileged: true
    networks:
      san-net-4:
        interface_name: eth0

networks:
  ring12:
  ring23:
  ring34:
  ring41:
  san-net-1:
  san-net-2:
  san-net-3:
  san-net-4:
