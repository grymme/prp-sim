# PRP integration test topology:
#
#   san-a --(san-net-a)-- redbox-a --(lan-a, lan-b)-- redbox-b --(san-net-b)-- san-b
#
# Each RedBox bridges its OWN SAN segment onto both PRP LANs. The two SAN
# segments are separate L2 domains; the PRP network is the transparent L2
# bridge between them (so both SANs use the same 10.0.0.0/24 subnet while
# sitting on different Docker networks). If LAN A fails, traffic continues
# on LAN B (zero recovery time).
#
# IMPORTANT: two RedBoxes must NEVER share a single SAN segment - that
# creates a loop where each RedBox re-encodes and re-floods the other's
# frames (packet storm).
#
# Interface naming inside each RedBox (pinned deterministically via
# interface_name, because Docker 28+ no longer assigns ethN in config order):
#   eth0 = lan-a, eth1 = lan-b, eth2 = interlink (SAN side)

x-redbox: &redbox
  image: prp-sim:test
  privileged: true

services:
  redbox-a:
    <<: *redbox
    volumes:
      - ./configs/redbox-a.yaml:/etc/prp/config.yaml
    networks:
      lan-a:
        interface_name: eth0
      lan-b:
        interface_name: eth1
      san-net-a:
        interface_name: eth2
        aliases:
          - redbox-a

  redbox-b:
    <<: *redbox
    volumes:
      - ./configs/redbox-b.yaml:/etc/prp/config.yaml
    networks:
      lan-a:
        interface_name: eth0
      lan-b:
        interface_name: eth1
      san-net-b:
        interface_name: eth2
        aliases:
          - redbox-b

  san-a:
    image: alpine:3.19
    command: ["sh", "-c", "ip addr add 10.0.0.11/24 dev eth0 2>/dev/null; sleep 3600"]
    privileged: true
    networks:
      san-net-a:
        interface_name: eth0
        ipv4_address: 10.9.0.11

  san-b:
    image: alpine:3.19
    command: ["sh", "-c", "ip addr add 10.0.0.12/24 dev eth0 2>/dev/null; sleep 3600"]
    privileged: true
    networks:
      san-net-b:
        interface_name: eth0
        ipv4_address: 10.8.0.12

networks:
  lan-a:
  lan-b:
  san-net-a:
    ipam:
      config:
        - subnet: 10.9.0.0/24
  san-net-b:
    ipam:
      config:
        - subnet: 10.8.0.0/24