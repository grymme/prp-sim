  <text x="32" y="30" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">GOOSE</text>
  <text x="32" y="43" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#7dff7d" text-anchor="middle">SV TX</text>
  <!-- Transmit arrows -->
  <line x1="32" y1="46" x2="32" y2="54" stroke="#7dff7d" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="28,50 32,56 36,50" fill="#7dff7d"/>
