name: Build and Publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grymme/prp-sim

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: go mod download && go test ./...

      - name: Build Docker image
        run: |
          # Tag pushes use the tag itself; main-branch builds use the most
          # recent tag so the `latest` image shows a real version, not "dev".
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
          fi
          docker build --build-arg VERSION="$VER" -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (main → latest + edge)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge

      - name: Push to GHCR (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
